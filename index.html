<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Check</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B7%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ KIOSK (default, minimal) ============ -->
  <div id="kiosk" class="kiosk">
    <button type="button" class="corner-btn fs-toggle" id="fsToggle" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
    <button type="button" class="corner-btn manage-toggle" id="openManage" aria-label="Manage products">⚙️</button>

    <div class="kiosk-inner">
      <!-- Idle -->
      <div class="kiosk-state" id="stateIdle">
        <div class="kiosk-icon">🔎</div>
        <div class="kiosk-title">Scan a barcode</div>
        <div class="kiosk-sub">to check the price</div>
      </div>

      <!-- Found -->
      <div class="kiosk-state" id="stateFound" hidden>
        <div class="found-name" id="foundName">—</div>
        <div class="found-price" id="foundPrice">—</div>
        <div class="found-meta" id="foundMeta"></div>
        <div class="countdown"><span class="countdown-bar" id="countdownBar"></span></div>
      </div>

      <!-- Not found -->
      <div class="kiosk-state" id="stateNotFound" hidden>
        <div class="kiosk-icon warn">⚠️</div>
        <div class="kiosk-title">Price not found</div>
        <div class="notfound-code" id="notFoundCode"></div>
        <div class="kiosk-sub">Ask the Boss !! 🥺🥺</div>
        <div class="countdown"><span class="countdown-bar" id="countdownBar2"></span></div>
      </div>
    </div>
    <div class="kiosk-status" id="kioskStatus"></div>
  </div>

  <!-- ============ PIN GATE ============ -->
  <div id="pinOverlay" class="overlay pin-overlay" hidden>
    <form id="pinForm" class="pin-box" autocomplete="off">
      <div class="pin-title">Enter PIN</div>
      <input type="password" id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" aria-label="PIN" />
      <div class="pin-error" id="pinError"></div>
      <div class="pin-pad" id="pinPad">
        <button type="button" class="pin-key" data-key="1">1</button>
        <button type="button" class="pin-key" data-key="2">2</button>
        <button type="button" class="pin-key" data-key="3">3</button>
        <button type="button" class="pin-key" data-key="4">4</button>
        <button type="button" class="pin-key" data-key="5">5</button>
        <button type="button" class="pin-key" data-key="6">6</button>
        <button type="button" class="pin-key" data-key="7">7</button>
        <button type="button" class="pin-key" data-key="8">8</button>
        <button type="button" class="pin-key" data-key="9">9</button>
        <button type="button" class="pin-key alt" data-key="back">⌫</button>
        <button type="button" class="pin-key" data-key="0">0</button>
        <button type="submit" class="pin-key ok" data-key="ok">✓</button>
      </div>
      <button type="button" class="btn pin-cancel" id="pinCancel">Cancel</button>
    </form>
  </div>

  <!-- ============ MANAGE PANEL (drawer) ============ -->
  <div id="manageOverlay" class="overlay" hidden></div>
  <aside id="managePanel" class="manage-panel" hidden aria-label="Manage products">
    <div class="manage-header">
      <h2>Manage Products</h2>
      <button type="button" class="btn" id="closeManage">Done</button>
    </div>

    <div class="manage-body">
      <!-- Summary -->
      <section class="summary">
        <div class="card">
          <span class="card-label">Products</span>
          <span class="card-value" id="sumCount">0</span>
        </div>
      </section>

      <!-- Settings -->
      <section class="settings-row">
        <label class="currency-label">
          Currency
          <input type="text" id="currency" value="$" maxlength="4" />
        </label>
        <label class="currency-label">
          Auto-clear (seconds)
          <input type="number" id="autoClear" min="1" max="60" step="1" value="5" />
        </label>
        <label class="currency-label">
          Manage PIN <span class="hint" id="pinStatus">off</span>
          <input type="password" id="pinField" inputmode="numeric" placeholder="digits; blank = off" />
        </label>
        <button type="button" class="btn" id="savePinBtn">Update PIN</button>
      </section>

      <!-- Add / edit product -->
      <section class="form-section">
        <h3 id="formTitle">Add Product</h3>
        <form id="productForm" autocomplete="off">
          <input type="hidden" id="productId" />
          <div class="grid">
            <label>
              Barcode
              <input type="text" id="fBarcode" inputmode="numeric" placeholder="e.g. 8934567890123" required />
            </label>
            <label>
              Product Name
              <input type="text" id="fName" placeholder="e.g. Coca-Cola 330ml" required />
            </label>
            <label>
              Price
              <input type="number" id="fPrice" min="0" step="0.01" placeholder="0.00" required />
            </label>
            <label>
              Category <span class="hint">optional</span>
              <input type="text" id="fCategory" placeholder="e.g. Beverages" />
            </label>
            <label>
              SKU / Stock code <span class="hint">optional</span>
              <input type="text" id="fSku" placeholder="e.g. BEV-001" />
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn primary" id="saveBtn">Save Product</button>
            <button type="button" class="btn" id="cancelEditBtn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <!-- Database -->
      <section class="table-section">
        <div class="table-head">
          <div>
            <h3 style="margin:0">Product Database</h3>
            <span class="hint" id="dbCount">0 products</span>
          </div>
          <div class="table-tools">
            <input type="search" id="search" class="search" placeholder="Search…" />
            <button type="button" class="btn" id="importBtn">Import CSV</button>
            <button type="button" class="btn" id="exportCsvBtn">Export CSV</button>
            <button type="button" class="btn" id="exportJsonBtn">Export JSON</button>
            <input type="file" id="importFile" accept=".csv,text/csv" hidden />
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Barcode</th>
                <th>Name</th>
                <th>Category</th>
                <th class="num">Price</th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <p class="empty" id="emptyMsg">No products yet. Add one above or import a CSV.</p>
      </section>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
